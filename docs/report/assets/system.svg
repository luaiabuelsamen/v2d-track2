<svg xmlns="http://www.w3.org/2000/svg" width="780" height="244" viewBox="0 -8 780 244" font-family="Times New Roman, Times, serif" font-size="6.6" fill="#111">
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#111"/></marker>
  <style>
    .pt{font-family:Helvetica,Arial,sans-serif;font-size:7px;font-weight:700;fill:#111}
    .panel{fill:#fbfbfb;stroke:#8a8a8a;stroke-width:0.6;rx:4}
    .data{fill:#fff;stroke:#111;stroke-width:0.6}
    .fix{fill:#ececec;stroke:#6f6f6f;stroke-width:0.7}
    .learn{fill:#d6e4f5;stroke:#4a6fa5;stroke-width:0.7}
    .dec{fill:#dcebd3;stroke:#5f8f52;stroke-width:0.7}
    .w{stroke:#111;stroke-width:0.65;fill:none;marker-end:url(#a)}
    .wd{stroke:#111;stroke-width:0.65;fill:none;marker-end:url(#a);stroke-dasharray:1.8 1.4}
    .ln{stroke:#111;stroke-width:0.65;fill:none}
    .ic{stroke:#111;stroke-width:0.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .i{font-style:italic}
    .sm{font-size:5.6px;fill:#333}
    .sub{font-size:4.4px}
    .lab{font-size:6.2px;fill:#111}
  </style>
</defs>
<rect x="0" y="-8" width="780" height="244" fill="#fff"/>

<!-- ===================== A) Reference ===================== -->
<rect x="6" y="10" width="178" height="140" class="panel"/>
<text x="12" y="19" class="pt">A) Reference <tspan class="i" font-family="Times New Roman,serif" font-weight="400">r</tspan></text>

<!-- demonstration frame -->
<g transform="translate(14,30)">
  <rect x="0" y="0" width="40" height="30" class="data"/>
  <g class="ic"><circle cx="15" cy="7.5" r="2.4"/><path d="M15 10 L15 19 M15 12 L10 16.5 M15 12 L21 14.5 M15 19 L11.5 27 M15 19 L18.5 27"/><path d="M20 21 L34 21 M22 21 L22 27 M32 21 L32 27"/></g>
  <rect x="20.5" y="12.5" width="4" height="3.2" fill="#555"/>
  <text x="20" y="38" text-anchor="middle" class="sm">video, SOMA-X</text>
</g>
<path class="w" d="M54 45 L66 45"/>

<!-- three tiers as data strips -->
<g transform="translate(68,30)">
  <!-- tier 1 -->
  <rect x="0" y="0" width="106" height="24" class="data"/>
  <text x="4" y="9" class="lab">Tier 1 · multi-view</text>
  <text x="4" y="19" class="lab"><tspan class="i">r</tspan> = <tspan class="i">r</tspan>*</text>
  <g fill="#555"><rect x="60" y="14" width="4" height="4"/><rect x="65" y="14" width="4" height="4"/><rect x="70" y="14" width="4" height="4"/><rect x="75" y="14" width="4" height="4"/><rect x="80" y="14" width="4" height="4"/><rect x="85" y="14" width="4" height="4"/><rect x="90" y="14" width="4" height="4"/><rect x="95" y="14" width="4" height="4"/></g>
  <path d="M60 10 C 68 4, 78 11, 100 4" class="ln"/>
  <!-- tier 2 -->
  <rect x="0" y="30" width="106" height="24" class="data"/>
  <text x="4" y="39" class="lab">Tier 2 · retarget</text>
  <text x="4" y="49" class="lab"><tspan class="i">r</tspan> = <tspan class="i">r</tspan>* + <tspan class="i">ε</tspan></text>
  <g fill="#555"><rect x="60" y="44" width="4" height="4"/><rect x="65" y="44" width="4" height="4"/><rect x="70" y="44" width="4" height="4"/><rect x="75" y="44" width="4" height="4"/><rect x="80" y="44" width="4" height="4"/><rect x="85" y="44" width="4" height="4"/><rect x="90" y="44" width="4" height="4"/><rect x="95" y="44" width="4" height="4"/></g>
  <path d="M60 40 C 68 34, 78 41, 100 34" stroke="#bbb" stroke-width="0.6" fill="none"/>
  <path d="M60 41.5 C 66 38, 72 43, 80 39 C 88 36, 94 40, 101 36" class="ln"/>
  <!-- tier 3 -->
  <rect x="0" y="60" width="106" height="24" class="data" stroke-dasharray="1.6 1.2"/>
  <text x="4" y="69" class="lab" fill="#444">Tier 3 · own recon.</text>
  <text x="4" y="79" class="lab" fill="#444"><tspan class="i">r</tspan> = <tspan class="i">f</tspan>(video)</text>
  <g fill="#999"><rect x="60" y="74" width="4" height="4"/><rect x="65" y="74" width="4" height="4"/><rect x="70" y="74" width="4" height="4"/><rect x="75" y="74" width="4" height="4"/><rect x="80" y="74" width="4" height="4"/><rect x="85" y="74" width="4" height="4"/><rect x="90" y="74" width="4" height="4"/><rect x="95" y="74" width="4" height="4"/></g>
  <path d="M60 70 C 68 64, 78 71, 100 64" stroke="#bbb" stroke-width="0.6" fill="none"/>
  <path d="M60 70 C 66 66, 71 69, 76 72 L 101 80" stroke="#444" stroke-width="0.6" fill="none" stroke-dasharray="1.2 1"/>
</g>
<text x="68" y="128" class="sm">object pose <tspan class="i">p</tspan><tspan class="sub" baseline-shift="sub">r</tspan>(<tspan class="i">t</tspan>), <tspan class="i">R</tspan><tspan class="sub" baseline-shift="sub">r</tspan>(<tspan class="i">t</tspan>) and SOMA-X body</text>
<text x="68" y="138" class="sm">all tiers are scored against <tspan class="i">r</tspan>*; only <tspan class="i">r</tspan> differs</text>

<!-- r out of panel A -->
<path class="w" d="M184 72 L198 72"/>
<text x="191" y="81" text-anchor="middle" class="lab"><tspan class="i">r</tspan></text>

<!-- ===================== B) Per-sequence policy ===================== -->
<rect x="200" y="10" width="300" height="140" class="panel"/>
<text x="206" y="19" class="pt">B) One policy per sequence</text>

<!-- retarget pill -->
<g transform="translate(208,54)">
  <path d="M0 0 H34 a18 18 0 0 1 0 36 H0 Z" class="fix"/>
  <text x="18" y="15" text-anchor="middle" class="lab">Retarget</text>
  <text x="18" y="25" text-anchor="middle" class="sm">IK → G1</text>
  <text x="22" y="48" text-anchor="middle" class="sm"><tspan class="i">q</tspan><tspan class="sub" baseline-shift="sub">ref</tspan>, <tspan class="i">p</tspan><tspan class="sub" baseline-shift="sub">ref</tspan></text>
</g>
<path class="w" d="M260 72 L272 72"/>

<!-- environment -->
<g transform="translate(274,40)">
  <rect x="0" y="0" width="78" height="64" class="data"/>
  <text x="39" y="9" text-anchor="middle" class="lab">Env: G1 + Dex3</text>
  <g class="ic" transform="translate(8,14)">
    <path d="M14 30 L58 30 M18 30 L18 38 M54 30 L54 38"/>
    <rect x="31" y="23.5" width="8" height="6.5" fill="#fff"/>
    <path d="M31 23.5 L37 20 L45 20 L39 23.5" fill="#fff"/><path d="M39 23.5 L45 20 L45 26.5 L39 30" fill="#fff"/>
    <path d="M26 20 L28 25 L26 29 M24 22 L24 27 M50 21 L48 25 L50 29 M52 22 L52 27"/>
