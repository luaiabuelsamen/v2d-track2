    <text x="50" y="30" font-size="4.6"><tspan class="i">k</tspan>=5</text>
    <text x="24" y="40" text-anchor="middle" class="sm"><tspan class="i">d</tspan><tspan class="sub" baseline-shift="sub">k</tspan>(<tspan class="i">t</tspan>) = ‖<tspan class="i">p</tspan><tspan class="sub" baseline-shift="sub">τk</tspan>(<tspan class="i">t</tspan>) − <tspan class="i">p</tspan><tspan class="sub" baseline-shift="sub">r</tspan>(<tspan class="i">t</tspan>)‖</text>
  </g>
</g>
