  </g>
  <text x="39" y="60" text-anchor="middle" class="sm">support primitive · dashed: <tspan class="i">r</tspan></text>
</g>

<!-- actor / critic pills -->
<g transform="translate(378,40)">
  <path d="M0 0 H30 a14 14 0 0 1 0 28 H0 Z" class="learn"/>
  <text x="18" y="17" text-anchor="middle" class="lab" font-weight="700"><tspan class="i">π</tspan><tspan class="sub" baseline-shift="sub">θ</tspan></text>
  <path d="M0 36 H30 a14 14 0 0 1 0 28 H0 Z" class="learn"/>
  <text x="18" y="53" text-anchor="middle" class="lab" font-weight="700"><tspan class="i">Q</tspan><tspan class="sub" baseline-shift="sub">φ</tspan></text>
</g>
<!-- obs strip into actor -->
<g fill="#555" transform="translate(357,50)"><rect x="0" y="0" width="3" height="3"/><rect x="0" y="3.6" width="3" height="3"/><rect x="0" y="7.2" width="3" height="3"/><rect x="0" y="10.8" width="3" height="3"/></g>
<path class="w" d="M352 56 L376 56"/><text x="364" y="48" text-anchor="middle" class="sm"><tspan class="i">s</tspan><tspan class="sub" baseline-shift="sub">t</tspan></text>
<path class="w" d="M376 86 L352 86"/><text x="364" y="95" text-anchor="middle" class="sm"><tspan class="i">a</tspan><tspan class="sub" baseline-shift="sub">t</tspan></text>
<path class="wd" d="M352 72 L376 72"/><text x="364" y="69" text-anchor="middle" class="sm"><tspan class="i">R</tspan><tspan class="sub" baseline-shift="sub">t</tspan></text>
<path class="ln" d="M396 68 L396 76" />
<text x="412" y="38" text-anchor="middle" class="sm">SAC</text>

<!-- reward -->
<g transform="translate(274,112)">
  <rect x="0" y="0" width="140" height="30" class="data" stroke="#777"/>
  <text x="5" y="10" class="lab"><tspan class="i">R</tspan><tspan class="sub" baseline-shift="sub">t</tspan> = <tspan class="i">r</tspan><tspan class="sub" baseline-shift="sub">body</tspan> + <tspan class="i">r</tspan><tspan class="sub" baseline-shift="sub">pos</tspan> + <tspan class="i">r</tspan><tspan class="sub" baseline-shift="sub">ori</tspan> + <tspan class="i">r</tspan><tspan class="sub" baseline-shift="sub">contact</tspan></text>
  <text x="5" y="20" class="sm"><tspan class="i">r</tspan><tspan class="sub" baseline-shift="sub">ori</tspan> = exp(−‖log(<tspan class="i">R</tspan><tspan class="sub" baseline-shift="sub">obj</tspan><tspan class="sup" baseline-shift="super" font-size="4.4">⊤</tspan><tspan class="i">R</tspan><tspan class="sub" baseline-shift="sub">r</tspan>)‖² / <tspan class="i">σ</tspan>²)   (added)</text>
  <text x="5" y="27" class="sm">one SAC run per clip · support primitive staged per clip</text>
</g>

<!-- checkpoint timeline (EXPO-style circles) -->
<g transform="translate(432,44)">
  <text x="30" y="0" text-anchor="middle" class="sm">checkpoints</text>
  <g>
    <circle cx="6" cy="12" r="4" class="data"/><text x="6" y="14" text-anchor="middle" font-size="4.6"><tspan class="i">θ</tspan><tspan class="sub" baseline-shift="sub">1</tspan></text>
    <circle cx="6" cy="24" r="4" class="data"/><text x="6" y="26" text-anchor="middle" font-size="4.6"><tspan class="i">θ</tspan><tspan class="sub" baseline-shift="sub">2</tspan></text>
    <circle cx="6" cy="36" r="4" class="data"/><text x="6" y="38" text-anchor="middle" font-size="4.6"><tspan class="i">θ</tspan><tspan class="sub" baseline-shift="sub">3</tspan></text>
    <text x="6" y="48" text-anchor="middle" font-size="5">⋮</text>
    <circle cx="6" cy="58" r="4" class="data"/><text x="6" y="60" text-anchor="middle" font-size="4.6"><tspan class="i">θ</tspan><tspan class="sub" baseline-shift="sub">7</tspan></text>
  </g>
  <path class="ln" d="M6 16 L6 20 M6 28 L6 32 M6 40 L6 42 M6 52 L6 54"/>
  <!-- rollouts tau_k as little curves -->
  <g class="ln">
    <path d="M14 12 L20 12"/><path d="M22 14 C 26 10, 30 14, 36 9" />
    <path d="M14 24 L20 24"/><path d="M22 26 C 26 22, 30 26, 36 21" />
    <path d="M14 36 L20 36"/><path d="M22 38 C 26 34, 30 36, 34 30 L 36 26" />
    <path d="M14 58 L20 58"/><path d="M22 60 C 26 56, 30 60, 36 55" />
  </g>
  <text x="48" y="14" class="sm"><tspan class="i">τ</tspan><tspan class="sub" baseline-shift="sub">1</tspan></text>
  <text x="48" y="26" class="sm"><tspan class="i">τ</tspan><tspan class="sub" baseline-shift="sub">2</tspan></text>
  <text x="48" y="38" class="sm"><tspan class="i">τ</tspan><tspan class="sub" baseline-shift="sub">3</tspan></text>
  <text x="48" y="60" class="sm"><tspan class="i">τ</tspan><tspan class="sub" baseline-shift="sub">7</tspan></text>
  <text x="30" y="72" text-anchor="middle" class="sm">one rollout each</text>
</g>
<path class="w" d="M414 56 L434 56" />
<text x="424" y="52" text-anchor="middle" class="sm"><tspan class="i">θ</tspan></text>

